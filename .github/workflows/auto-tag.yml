name: Auto Tag Release

# Runs after every push to main (i.e. every merged, reviewed PR). If
# manifest.json's version was bumped as part of that PR and no tag for
# it exists yet, tags main at that version and calls the Release
# workflow directly (as a job in this run, not via the tag push —
# GITHUB_TOKEN-authored pushes don't trigger other workflows, so
# relying on that would silently never fire). Nobody hand-pushes
# release tags: every release traces back to a reviewed, merged PR.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      should_tag: ${{ steps.check.outputs.should_tag }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether manifest.json's version needs a new tag
        id: check
        run: |
          version=$(jq -r .version manifest.json)
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "manifest.json version '$version' isn't a valid extension version; skipping." >&2
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to release."
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.should_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"

  release:
    needs: tag
    if: needs.tag.outputs.should_tag == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
