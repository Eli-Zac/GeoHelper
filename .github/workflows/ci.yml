name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json is well-formed
        run: jq empty manifest.json

      - name: Check required manifest fields
        run: |
          for field in manifest_version name version; do
            value=$(jq -r --arg f "$field" '.[$f] // empty' manifest.json)
            if [ -z "$value" ]; then
              echo "manifest.json is missing required field: $field" >&2
              exit 1
            fi
          done

      # The Chrome Web Store rejects an upload whose description exceeds
      # 132 characters, so catch it here rather than at upload time.
      - name: Check manifest description length
        run: |
          description=$(jq -r '.description // empty' manifest.json)
          length=${#description}
          if [ "$length" -gt 132 ]; then
            echo "manifest.json description is $length characters; the Chrome Web Store allows at most 132." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JS syntax
        run: |
          for f in background.js content.js locate.js; do
            node --check "$f"
          done
