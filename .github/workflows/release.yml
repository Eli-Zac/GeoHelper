name: Release

# Triggered either by pushing a "vX.Y.Z" tag directly, or as a reusable
# workflow called in-process by Auto Tag Release (see auto-tag.yml) —
# that indirection matters because a tag pushed by GITHUB_TOKEN doesn't
# itself trigger other workflow runs, so auto-tag.yml invokes this one
# as a job rather than relying on the tag push to fire it.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Derive and validate version from tag
        id: version
        run: |
          version="${RELEASE_TAG#v}"
          # Chrome extension versions: 1-4 dot-separated non-negative integers.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag '$RELEASE_TAG' isn't a valid extension version (expected vX.Y.Z, integers only)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set manifest.json version to match tag
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/geohelper-${{ steps.version.outputs.version }}.zip" \
            manifest.json background.js content.js content.css locate.js icons

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/geohelper-${{ steps.version.outputs.version }}.zip" \
            --title "GeoHelper ${{ steps.version.outputs.version }}" \
            --generate-notes
