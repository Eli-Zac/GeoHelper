name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Derive and validate version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Chrome extension versions: 1-4 dot-separated non-negative integers.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' isn't a valid extension version (expected vX.Y.Z, integers only)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set manifest.json version to match tag
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/geohelper-${{ steps.version.outputs.version }}.zip" \
            manifest.json background.js content.js content.css locate.js

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/geohelper-${{ steps.version.outputs.version }}.zip" \
            --title "GeoHelper ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Sync manifest version back to main
        run: |
          git fetch origin main
          git checkout -B main origin/main

          current=$(jq -r .version manifest.json)
          if [ "$current" = "${{ steps.version.outputs.version }}" ]; then
            echo "main is already at ${{ steps.version.outputs.version }}; nothing to sync."
            exit 0
          fi

          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump manifest version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin main
