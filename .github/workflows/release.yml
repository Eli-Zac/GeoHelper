name: Release

# Triggered either by pushing a "vX.Y.Z" tag directly, or as a reusable
# workflow called in-process by Auto Tag Release (see auto-tag.yml) —
# that indirection matters because a tag pushed by GITHUB_TOKEN doesn't
# itself trigger other workflow runs, so auto-tag.yml invokes this one
# as a job rather than relying on the tag push to fire it.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Derive and validate version from tag
        id: version
        run: |
          version="${RELEASE_TAG#v}"
          # Chrome extension versions: 1-4 dot-separated non-negative integers.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag '$RELEASE_TAG' isn't a valid extension version (expected vX.Y.Z, integers only)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set manifest.json version to match tag
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Build extension zip
        run: |
          mkdir -p dist
          zip -r "dist/geohelper-${{ steps.version.outputs.version }}.zip" \
            manifest.json background.js content.js content.css locate.js icons

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/geohelper-${{ steps.version.outputs.version }}.zip" \
            --title "GeoHelper ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Publish to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          access_token=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" \
            -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" \
            -d grant_type=refresh_token \
            | jq -r '.access_token')

          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Failed to obtain a Chrome Web Store access token." >&2
            exit 1
          fi

          upload_response=$(curl -sS -X PUT \
            -H "Authorization: Bearer $access_token" \
            -H "x-goog-api-version: 2" \
            -T "dist/geohelper-${{ steps.version.outputs.version }}.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")

          upload_state=$(echo "$upload_response" | jq -r '.uploadState // empty')
          if [ "$upload_state" != "SUCCESS" ]; then
            echo "Chrome Web Store upload failed:" >&2
            echo "$upload_response" >&2
            exit 1
          fi

          publish_response=$(curl -sS -X POST \
            -H "Authorization: Bearer $access_token" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish")

          publish_status=$(echo "$publish_response" | jq -r '.status[0] // empty')
          case "$publish_status" in
            OK|ITEM_PENDING_REVIEW)
              echo "Chrome Web Store publish succeeded: $publish_status"
              ;;
            *)
              echo "Chrome Web Store publish failed:" >&2
              echo "$publish_response" >&2
              exit 1
              ;;
          esac
